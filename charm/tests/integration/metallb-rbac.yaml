# Workaround for the MicroK8s 1.36 metallb addon, whose controller lacks RBAC for
# ConfigurationState resources and therefore never assigns LoadBalancer IPs.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: metallb-configurationstates
rules:
  - apiGroups: [metallb.io]
    resources: [configurationstates, configurationstates/status]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: metallb-configurationstates
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: metallb-configurationstates
subjects:
  - kind: ServiceAccount
    name: controller
    namespace: metallb-system
  - kind: ServiceAccount
    name: speaker
    namespace: metallb-system
