# Testing tools configuration
[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.pytest.ini_options]
minversion = "6.0"
log_cli_level = "INFO"

# Linting tools configuration
[tool.ruff]
line-length = 99
extend-exclude = ["__pycache__", "*.egg_info", "lib", ".venv"]

[tool.ruff.lint]
select = ["E", "W", "F", "C", "N", "D", "I001"]
ignore = [
    "D105",
    "D107",
    "D203",
    "D204",
    "D213",
    "D215",
    "D400",
    "D404",
    "D406",
    "D407",
    "D408",
    "D409",
    "D413",
]
per-file-ignores = {"tests/*" = ["D100", "D101", "D102", "D103", "D104", "D205", "D212", "D415"]}

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.codespell]
skip = "build,lib,venv,.venv,icon.svg,.tox,.git,.mypy_cache,.ruff_cache,.coverage,LICENSE"

[tool.pyright]
include = ["src"]
extraPaths = ["lib", "src"]
pythonVersion = "3.12"
