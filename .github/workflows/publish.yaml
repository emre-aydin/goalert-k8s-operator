name: Publish to Charmhub

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/ci.yaml

  publish:
    name: Upload rock and charm to Charmhub (latest/edge)
    needs: tests
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      CHARMCRAFT_AUTH: ${{ secrets.CHARMHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Install tooling
        run: |
          sudo snap install lxd
          sudo lxd init --auto
          sudo usermod -aG lxd "$USER"
          sudo snap install rockcraft --classic
          sudo snap install charmcraft --classic
          # Docker on the runner sets the FORWARD policy to DROP, which cuts the LXD
          # build instances off from the network.
          sudo iptables -P FORWARD ACCEPT
          sudo ip6tables -P FORWARD ACCEPT
      - name: Pack rock
        working-directory: rock
        run: sg lxd -c "rockcraft pack --verbose"
      - name: Pack charm
        working-directory: charm
        run: sg lxd -c "charmcraft pack --verbose"
      # The charm is uploaded before the rock: Charmhub only accepts the app-image
      # resource once a charm revision that declares it exists.
      - name: Upload, attach resource and release
        working-directory: charm
        shell: bash
        run: |
          set -euo pipefail
          revision=$(charmcraft upload ./*.charm --format=json | jq -er .revision)
          rock=$(ls ../rock/*.rock | head -1)
          resource=$(charmcraft upload-resource goalert-k8s app-image \
            --image="oci-archive:${rock}" --format=json | jq -er .revision)
          charmcraft release goalert-k8s --revision="${revision}" \
            --channel=latest/edge --resource="app-image:${resource}"
